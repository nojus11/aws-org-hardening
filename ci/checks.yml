name: Checks

on: push # run on every push

permissions:
  contents: read # this job can only read the repo

jobs:
  checks:
    runs-on: ubuntu-24.04 # a fresh Linux machine from GitHub, deleted afterwards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6 # same as the laptop
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive -diff infra

      - name: Checkov
        run: |
          pipx install checkov==3.3.29 # same version as the last local scan
          checkov -d infra --framework terraform --quiet --compact

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted later is still in git
          persist-credentials: false

      # Official release, checked against a pinned SHA-256 (same idea as
      # pinning actions). Dependabot can't update this: bump by hand.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Secret scan (full history)
        run: gitleaks git --redact --verbose .
